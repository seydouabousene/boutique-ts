<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-boutique-ts</title>
  </head>
  <body>
    <header class="entete">
      <h1>Mini-boutique</h1>
      <p>Panier : <span id="compteur">0</span> article(s)</p>
    </header>
    <main class="page">
      <section>
        <div class="filtres">
          <input type="search" id="recherche" placeholder="Recherche un produit">
          <select name="" id="filtre-categorie" >
            <option value="toutes">Toutes</option>
            <option value="vetements">Vetements</option>
            <option value="chaussures">Chaussures</option>
            <option value="accessoires">Accessoires</option>
            <option value="maison">Maison</option>
          </select>
        </div>
        <div id="catalogue" class="grille">
          <aside class="panier">
            <h2>Mon panier</h2>
            <ul id="lignes-panier"></ul>
            <p class="total">Total : <strong id="total">0F CFA</strong></p>
          </aside>
        </div>
      </section>
    </main>








    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
